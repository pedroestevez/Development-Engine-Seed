name: CI

# The Amendment gate's CI half (docs/GATES.md). Runs on every pull request
# whatever its base branch (default activity types), and on every push to
# main, so no change to this repo — engine file or otherwise — lands without
# at least these checks having run.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo and writes logs.
permissions:
  contents: read

# SECURITY -- finding F5 (ALI-100 security pass, comment 0d889e41). Without a
# concurrency group, repeated pushes queue unbounded parallel runs; this is
# also the accepted mitigation for the ReDoS surface in check-md-links.js's
# heading regex (cap the job, do not rewrite the regex).
#
# The push-to-main exception is LOAD-BEARING, not stylistic. `cancel-in-progress`
# is true for pull_request runs only:
#
#   * Superseded PR runs are safe to cancel -- the newer head supersedes them.
#   * push:main runs are NOT. A cancelled run is not a failing run, so two quick
#     merges under an unconditional `cancel-in-progress: true` would leave an
#     already-merged commit with no completed gate verdict, and nothing reports
#     the absence. That is strictly worse than having no concurrency group at
#     all, and it would have been introduced BY a hardening.
#
# github.event_name is in the group key for the same reason: it stops a PR run
# and a push run for the same ref from cancelling each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-links:
    name: Markdown cross-reference check
    runs-on: ubuntu-latest
    # F5: bounded. Observed runtime is seconds; 5 minutes is >=10x headroom.
    # A job that hits its cap is reported as failed, so the bound is
    # fail-closed -- it cannot silently swallow a real gate verdict.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # F6: do not leave the job's GITHUB_TOKEN in .git/config for every
          # later step (and every PR-authored script they run) to reuse.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Vendored, dependency-free script (scripts/check-md-links.js) -- this
      # job installs nothing because that script has no dependencies and is
      # run directly with `node`. (It says nothing about the repository's
      # package.json, which has existed since ALI-102 landed the dispatcher
      # and is installed by the dispatcher-tests job below.) Validates every
      # relative cross-reference between CLAUDE.md, README.md, docs/*.md, and
      # .claude/**/*.md resolves to a real file/anchor -- and, since ALI-128,
      # that it resolves INSIDE the repository root (finding F3).
      - name: Check cross-references
        run: node scripts/check-md-links.js

  roster-consistency:
    name: Agent roster consistency (ALI-107 criterion-5)
    runs-on: ubuntu-latest
    # F5: bounded. Sub-30s job; 5 minutes is >=10x headroom.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # F6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Diffs the agent files docs/ENGINE.md §14's tree lists against what
      # actually exists in .claude/agents/, in both directions. Guards the
      # Coach-orphan class of drift: a role documented but never given a
      # file, or a file added/renamed on disk without updating the tree.
      - name: Check roster matches docs/ENGINE.md §14
        run: node scripts/check-roster-consistency.js

  blind-qa-tools-allowlist:
    name: Blind QA tools allowlist (ALI-105 AC2)
    runs-on: ubuntu-latest
    # F5: bounded. Sub-30s job, no network install; 5 minutes is >=10x
    # headroom. This job postdates finding F5 -- it is capped because
    # ALI-128 criterion 4 binds EVERY key under `jobs:`, resolved against the
    # shipped workflow rather than against the three jobs F5 happened to see.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # F6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The structural half of the blind test-author's blindness:
      # .claude/agents/qa.md's `tools:` frontmatter must be exactly `Write`
      # -- no Read/Edit/Grep/Glob/Bash/etc., no mcp__* tool. Fails loud if
      # the key is missing or names any forbidden tool.
      - name: Check qa.md's tools allowlist is exactly Write
        run: node scripts/check-qa-tools-allowlist.js

  dispatcher-tests:
    name: Dispatcher unit tests
    runs-on: ubuntu-latest
    # F5: bounded, at 10 rather than the finding's suggested 5. DELIBERATE:
    # F5 was written at aa2fda8, when no package.json existed and this job was
    # a pure no-op. It now performs a network `npm ci` plus `vitest run` plus
    # `tsc --noEmit`. 10 preserves the bound while keeping >=5x headroom over
    # observed runtime -- a cap tight enough to flake converts a real gate
    # into noise people learn to re-run past.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # F6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The dispatcher landed in ALI-102/ALI-103, so package.json and the
      # vitest suite (src/dispatcher/__tests__/) now exist: this step runs
      # `npm ci --ignore-scripts && npm test && npm run typecheck` and is a
      # real gate, not a no-op success. The guard stays because this seed is
      # templated into product clones (§14) that may have no dispatcher yet
      # -- there it must succeed, not skip, so the job stays green.
      #
      # `npm run typecheck` (-> tsc --noEmit) is ALI-128 criterion 11. Until
      # it landed, NO job in this workflow typechecked anything, so a
      # type-only regression reached main unnoticed -- including one that
      # would break ALI-105's AC6 "structural, not prose" guarantee, which
      # rests entirely on tsc staying green. A step, not a fourth job:
      # keeping it inside this guard preserves the product-clone behavior
      # above, and leaves the job-isolation evidence in ALI-128 criterion 5.2
      # unchanged.
      #
      # SECURITY -- security-pass finding F2, closed in part by ALI-137.
      # This job executes code authored by the pull request under review,
      # fork PRs included: `npm test` runs the suite of the very change
      # being reviewed. That is by design -- a gate that does not run the
      # proposed code is not a gate.
      #
      # `--ignore-scripts` is therefore a SUPPLY-CHAIN control, not an
      # anti-fork-attacker control. It blocks preinstall/install/postinstall
      # hooks in dependencies -- a compromised transitive package firing
      # before any human reads the diff (cf. tj-actions/changed-files, 2025).
      # It does NOT stop `npm test` from running PR-authored code, and on
      # `pull_request` the workflow that runs is the copy in the PR head, so
      # a deliberate fork attacker can simply delete this flag from their
      # own copy. Both residuals stay open by design; do not read this flag
      # as closing them.
      #
      # What actually bounds an attacker here is that this job is SECRETLESS
      # and read-only: no `secrets.*` reference, no credential-bearing `env:`,
      # workflow-level `permissions: contents: read`, and the trigger stays
      # `pull_request` -- never `pull_request_target`. Adding a secret to
      # this job, or widening those permissions, requires revisiting fork-PR
      # policy first (ALI-127: require approval for fork-PR workflow runs).
      - name: Run dispatcher tests and typecheck if present
        run: |
          if [ -f package.json ]; then
            npm ci --ignore-scripts
            npm test
            npm run typecheck
          else
            echo "no package.json — dispatcher not yet landed"
          fi
